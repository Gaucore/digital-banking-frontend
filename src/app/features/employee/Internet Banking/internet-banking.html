<div class="container-fluid">
  <div class="card shadow-sm banking-card">
    <!-- Header -->
    <div class="card-header bg-white border-bottom">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h3 class="mb-1">Internet Banking</h3>
          <small class="text-muted"> Enable Internet Banking for an existing customer. </small>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="card-body">
      <form [formGroup]="internetBankingForm" (ngSubmit)="enableInternetBanking()">
        <div class="row">
          <!-- Customer -->
          <div class="col-md-6 mb-4">
            <label class="form-label"> Customer </label>

            <select class="form-select" formControlName="customerId">
              <option value="">Select Customer</option>

              <option *ngFor="let customer of customerList" [value]="customer.id">
                {{ customer.customerCode }} -
                {{ customer.firstName }}
                {{ customer.lastName }}
              </option>
            </select>

            <small
              class="text-danger"
              *ngIf="submitted && internetBankingForm.controls['customerId'].invalid"
            >
              Customer is required.
            </small>
          </div>

          <!-- Username -->
          <div class="col-md-6 mb-4">
            <label class="form-label"> Username </label>

            <input
              type="text"
              class="form-control"
              placeholder="Enter Username"
              formControlName="username"
            />

            <small
              class="text-danger"
              *ngIf="submitted && internetBankingForm.controls['username'].invalid"
            >
              Username is required.
            </small>
          </div>

          <!-- Password -->
          <div class="col-md-6 mb-4">
            <label class="form-label"> Password </label>

            <input
              type="password"
              class="form-control"
              placeholder="Enter Password"
              formControlName="password"
            />

            <small
              class="text-danger"
              *ngIf="submitted && internetBankingForm.controls['password'].invalid"
            >
              Password is required.
            </small>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6 mb-4">
            <label class="form-label"> Confirm Password </label>

            <input
              type="password"
              class="form-control"
              placeholder="Confirm Password"
              formControlName="confirmPassword"
            />

            <small
              class="text-danger"
              *ngIf="submitted && internetBankingForm.hasError('passwordMismatch')"
            >
              Password does not match.
            </small>
          </div>
        </div>

        <hr />

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary px-5" [disabled]="loading">
            <i class="bi bi-globe2 me-2"></i>

            {{ loading ? 'Please wait...' : 'Enable Internet Banking' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
