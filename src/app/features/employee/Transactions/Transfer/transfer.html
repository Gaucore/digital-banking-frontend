<div class="container-fluid py-4">
  <div class="card shadow-sm border-0 transaction-card">
    <!-- Header -->

    <div class="card-header bg-white">
      <h3 class="mb-1">Transfer Money</h3>
      <p class="text-muted mb-0">Transfer funds between customer accounts.</p>
    </div>

    <!-- Body -->

    <div class="card-body">
      <form [formGroup]="transferForm" (ngSubmit)="save()">
        <div class="row g-4">
          <!-- From Account -->

          <div class="col-lg-6">
            <label class="form-label"> Source Account </label>

            <select class="form-select" formControlName="fromAccountNumber">
              <option value="">Select Source Account</option>

              <option *ngFor="let account of accountList" [value]="account.accountNumber">
                {{ account.accountNumber }} - {{ account.customerName }}
              </option>
            </select>
          </div>

          <!-- To Account -->

          <div class="col-lg-6">
            <label class="form-label"> Destination Account </label>

            <select class="form-select" formControlName="toAccountNumber">
              <option value="">Select Destination Account</option>

              <option *ngFor="let account of accountList" [value]="account.accountNumber">
                {{ account.accountNumber }} - {{ account.customerName }}
              </option>
            </select>
          </div>

          <!-- Amount -->

          <div class="col-lg-6">
            <label class="form-label"> Transfer Amount </label>

            <div class="input-group">
              <span class="input-group-text"> ₹ </span>

              <input
                type="number"
                class="form-control"
                placeholder="Enter Amount"
                formControlName="amount"
              />
            </div>
          </div>

          <!-- Remarks -->

          <div class="col-12">
            <label class="form-label"> Remarks </label>

            <textarea
              class="form-control"
              rows="4"
              formControlName="remarks"
              placeholder="Enter transfer remarks"
            ></textarea>
          </div>
        </div>

        <hr class="my-4" />

        <div class="d-flex justify-content-end">
          <button class="btn btn-primary btn-lg px-5" type="submit">
            <i class="bi bi-arrow-left-right me-2"></i>

            Transfer Money
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
